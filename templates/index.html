<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 3rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4rem 5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .greeting {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7, #f107a3);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }

        .subtitle {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
        }

        .host-info {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .host-info .dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .tech-stack {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .tech-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .tech-badge:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(123, 47, 247, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #1a1a2e;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 255, 136, 0.5);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn:active {
            transform: translateY(0);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            min-width: 320px;
            max-width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: white;
        }

        .modal-body {
            color: rgba(255, 255, 255, 0.8);
        }

        .info-grid {
            display: grid;
            gap: 0.75rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .info-value {
            font-weight: 500;
            color: #00d4ff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
        }

        .status-healthy {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Navigation Cards */
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2.5rem;
        }

        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
        }

        .nav-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .nav-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .nav-card-icon.swap {
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
        }

        .nav-card-icon.pool {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
        }

        .nav-card-icon.charts {
            background: linear-gradient(135deg, #f7931a, #ff4757);
        }

        .nav-card-icon svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .nav-card-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .nav-card-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        @media (max-width: 600px) {
            .nav-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="greeting">Hello World!</h1>
            <p class="subtitle">Your containerized application is running</p>
            <div class="host-info">
                <span class="dot"></span>
                <span>Pod: <strong id="pod-name">{{ hostname }}</strong></span>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" onclick="refreshPod()">
                    <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    Refresh Pod
                </button>
                <button class="btn btn-success" onclick="healthCheck()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                    Health Check
                </button>
                <button class="btn btn-secondary" onclick="showInfo()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 16v-4M12 8h.01"/>
                    </svg>
                    System Info
                </button>
            </div>
            <div class="tech-stack">
                <span class="tech-badge">Python</span>
                <span class="tech-badge">Flask</span>
                <span class="tech-badge">Docker</span>
                <span class="tech-badge">Kubernetes</span>
            </div>

            <!-- Navigation Cards -->
            <div class="nav-cards">
                <a href="/exchange" class="nav-card">
                    <div class="nav-card-icon swap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
                        </svg>
                    </div>
                    <span class="nav-card-title">Swap</span>
                    <span class="nav-card-desc">Trade tokens instantly</span>
                </a>
                <a href="/pool" class="nav-card">
                    <div class="nav-card-icon pool">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 12h8M12 8v8"/>
                        </svg>
                    </div>
                    <span class="nav-card-title">Pool</span>
                    <span class="nav-card-desc">Provide liquidity & earn</span>
                </a>
                <a href="/charts" class="nav-card">
                    <div class="nav-card-icon charts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3v18h18"/>
                            <path d="M18 9l-5 5-4-4-3 3"/>
                        </svg>
                    </div>
                    <span class="nav-card-title">Charts</span>
                    <span class="nav-card-desc">Live market data</span>
                </a>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modal-title">Info</span>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        async function refreshPod() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spin');

            try {
                const res = await fetch('/api/pod');
                const data = await res.json();
                document.getElementById('pod-name').textContent = data.pod;
            } catch (e) {
                console.error(e);
            }

            setTimeout(() => icon.classList.remove('spin'), 500);
        }

        async function healthCheck() {
            try {
                const res = await fetch('/health');
                const data = await res.json();

                document.getElementById('modal-title').textContent = 'Health Check';
                document.getElementById('modal-body').innerHTML = `
                    <div class="status-badge status-healthy">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                            <path d="M22 4L12 14.01l-3-3"/>
                        </svg>
                        ${data.status.toUpperCase()}
                    </div>
                    <div class="info-grid" style="margin-top: 1rem;">
                        <div class="info-row">
                            <span class="info-label">Pod</span>
                            <span class="info-value">${data.pod}</span>
                        </div>
                    </div>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (e) {
                console.error(e);
            }
        }

        async function showInfo() {
            try {
                const res = await fetch('/api/info');
                const data = await res.json();

                document.getElementById('modal-title').textContent = 'System Info';
                document.getElementById('modal-body').innerHTML = `
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label">Hostname</span>
                            <span class="info-value">${data.hostname}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Python</span>
                            <span class="info-value">${data.python_version}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Platform</span>
                            <span class="info-value">${data.platform}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Uptime</span>
                            <span class="info-value">${formatUptime(data.uptime_seconds)}</span>
                        </div>
                    </div>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (e) {
                console.error(e);
            }
        }

        function formatUptime(seconds) {
            if (seconds < 60) return seconds + 's';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return h + 'h ' + m + 'm';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
